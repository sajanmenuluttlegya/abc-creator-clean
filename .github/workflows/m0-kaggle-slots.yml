# Runs entirely on GitHub and Kaggle; no Windows PC dependency.
name: M0 Kaggle Slot Controller

on:
  schedule:
    # Exact 15-minute warm starts for all six four-hour IST slots.
    - cron: "45 3,7,11,15,19,23 * * *"
      timezone: "Asia/Kolkata"

    # Self-healing checks. These avoid the busy top-of-hour minute while
    # retrying every five minutes if an exact scheduled run is delayed.
    - cron: "2-59/5 * * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:
    inputs:
      account:
        description: "Kaggle account to start, or current for automatic IST selection"
        required: true
        default: current
        type: choice
        options:
          - current
          - cinefax
          - steverichards77
          - ashstizhard
          - dpstards
          - iitmania
          - assskr

permissions:
  contents: read

concurrency:
  group: abc-creator-m0-kaggle-controller
  cancel-in-progress: false

jobs:
  control-current-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      M0_WORKER_API_KEY: ${{ secrets.M0_WORKER_API_KEY }}
      KAGGLE_TOKEN_CINEFAX: ${{ secrets.KAGGLE_TOKEN_CINEFAX }}
      KAGGLE_TOKEN_STEVERICHARDS77: ${{ secrets.KAGGLE_TOKEN_STEVERICHARDS77 }}
      KAGGLE_TOKEN_ASHSTIZHARD: ${{ secrets.KAGGLE_TOKEN_ASHSTIZHARD }}
      KAGGLE_TOKEN_DPSTARDS: ${{ secrets.KAGGLE_TOKEN_DPSTARDS }}
      KAGGLE_TOKEN_IITMANIA: ${{ secrets.KAGGLE_TOKEN_IITMANIA }}
      KAGGLE_TOKEN_ASSSKR: ${{ secrets.KAGGLE_TOKEN_ASSSKR }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8:backslashreplace"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select automatic or manual account
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACCOUNT: ${{ inputs.account }}
        run: |
          set -euo pipefail

          account="current"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_ACCOUNT" ]]; then
            account="$MANUAL_ACCOUNT"
          fi

          echo "Selected controller mode: $account"
          echo "account=$account" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official Kaggle CLI
        run: python -m pip install --disable-pip-version-check "kaggle==2.2.0"

      - name: Start, verify, or recover the expected M0 worker
        run: >-
          python automation/m0_slot_controller.py
          --account "${{ steps.select.outputs.account }}"
