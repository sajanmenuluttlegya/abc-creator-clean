# Runs entirely on GitHub and Kaggle; no Windows PC dependency.
name: M0 Kaggle Slot Controller

on:
  schedule:
    - cron: "45 23 * * *"
      timezone: "Asia/Kolkata"
    - cron: "5 0 * * *"
      timezone: "Asia/Kolkata"
    - cron: "45 3 * * *"
      timezone: "Asia/Kolkata"
    - cron: "5 4 * * *"
      timezone: "Asia/Kolkata"
    - cron: "45 7 * * *"
      timezone: "Asia/Kolkata"
    - cron: "5 8 * * *"
      timezone: "Asia/Kolkata"
    - cron: "45 11 * * *"
      timezone: "Asia/Kolkata"
    - cron: "5 12 * * *"
      timezone: "Asia/Kolkata"
    - cron: "45 15 * * *"
      timezone: "Asia/Kolkata"
    - cron: "5 16 * * *"
      timezone: "Asia/Kolkata"
    - cron: "45 19 * * *"
      timezone: "Asia/Kolkata"
    - cron: "5 20 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:
    inputs:
      account:
        description: "Kaggle account to start, or current for the active IST slot"
        required: true
        default: current
        type: choice
        options:
          - current
          - cinefax
          - steverichards77
          - ashstizhard
          - dpstards
          - iitmania
          - assskr

  push:
    branches:
      - main
    paths:
      - ".github/workflows/m0-kaggle-slots.yml"
      - "automation/m0_kaggle_controller.py"

permissions:
  contents: read

concurrency:
  group: abc-creator-m0-kaggle-controller
  cancel-in-progress: false

jobs:
  select-account:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      account: ${{ steps.select.outputs.account }}
    steps:
      - id: select
        name: Select the scheduled account
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ACCOUNT: ${{ inputs.account }}
        run: |
          set -euo pipefail

          account=""

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              "45 23 * * *"|"5 0 * * *") account="cinefax" ;;
              "45 3 * * *"|"5 4 * * *") account="steverichards77" ;;
              "45 7 * * *"|"5 8 * * *") account="ashstizhard" ;;
              "45 11 * * *"|"5 12 * * *") account="dpstards" ;;
              "45 15 * * *"|"5 16 * * *") account="iitmania" ;;
              "45 19 * * *"|"5 20 * * *") account="assskr" ;;
              *) echo "Unknown scheduled expression: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_ACCOUNT" != "current" ]]; then
            account="$MANUAL_ACCOUNT"
          else
            hour="$(TZ=Asia/Kolkata date +%H)"
            hour=$((10#$hour))

            if (( hour < 4 )); then
              account="cinefax"
            elif (( hour < 8 )); then
              account="steverichards77"
            elif (( hour < 12 )); then
              account="ashstizhard"
            elif (( hour < 16 )); then
              account="dpstards"
            elif (( hour < 20 )); then
              account="iitmania"
            else
              account="assskr"
            fi
          fi

          echo "Selected account: $account"
          echo "account=$account" >> "$GITHUB_OUTPUT"

  start-current-slot:
    needs: select-account
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      M0_ACCOUNT: ${{ needs.select-account.outputs.account }}
      M0_WORKER_API_KEY: ${{ secrets.M0_WORKER_API_KEY }}
      KAGGLE_TOKEN_CINEFAX: ${{ secrets.KAGGLE_TOKEN_CINEFAX }}
      KAGGLE_TOKEN_STEVERICHARDS77: ${{ secrets.KAGGLE_TOKEN_STEVERICHARDS77 }}
      KAGGLE_TOKEN_ASHSTIZHARD: ${{ secrets.KAGGLE_TOKEN_ASHSTIZHARD }}
      KAGGLE_TOKEN_DPSTARDS: ${{ secrets.KAGGLE_TOKEN_DPSTARDS }}
      KAGGLE_TOKEN_IITMANIA: ${{ secrets.KAGGLE_TOKEN_IITMANIA }}
      KAGGLE_TOKEN_ASSSKR: ${{ secrets.KAGGLE_TOKEN_ASSSKR }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8:backslashreplace"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official Kaggle CLI
        run: python -m pip install --disable-pip-version-check "kaggle==2.2.0"

      - name: Start or recover the selected M0 worker
        run: python automation/m0_kaggle_controller.py --account "$M0_ACCOUNT"
