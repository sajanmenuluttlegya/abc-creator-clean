name: Apply category icon corrections

on:
  push:
    branches:
      - fix/category-icons-book-business-social-20260722
    paths:
      - automation/apply_category_icon_corrections_20260722.py
      - .github/workflows/apply-category-icon-corrections-20260722.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_verification_placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-verification-placeholder
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/category-icons-book-business-social-20260722
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded UI patch
        run: python automation/apply_category_icon_corrections_20260722.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Install dependencies
        working-directory: abc-creator-app
        run: npm ci

      - name: Production build
        working-directory: abc-creator-app
        run: npm run build

      - name: Validate UI-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | grep '^abc-creator-app/' || true)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/components/PlatformToolLogo.tsx'
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/components/ThemeIcon.tsx'
          grep -q 'if (value.includes("social")) return "instagram";' abc-creator-app/components/PlatformToolLogo.tsx
          grep -q 'if (value.includes("business")) return "briefcase";' abc-creator-app/components/PlatformToolLogo.tsx
          grep -q 'getCategoryNavigationLogoName(category)' abc-creator-app/components/PlatformToolLogo.tsx
          grep -q 'rotate(-10 12 12)' abc-creator-app/components/ThemeIcon.tsx
          ! printf '%s\n' "$changed" | grep -E 'api/|lib/tools|credit|server-|public-tools|ToolFormRenderer'

      - name: Remove temporary automation files
        run: |
          rm automation/apply_category_icon_corrections_20260722.py
          rm .github/workflows/apply-category-icon-corrections-20260722.yml

      - name: Commit verified UI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct Book, Business, and Social category icons'
          git push origin HEAD:fix/category-icons-book-business-social-20260722
