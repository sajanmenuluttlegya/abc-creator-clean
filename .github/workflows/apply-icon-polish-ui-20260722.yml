name: Apply UI icon polish

on:
  push:
    branches:
      - fix/video-campaign-finance-cyber-ui-20260722
    paths:
      - automation/apply_icon_polish_ui_20260722.py
      - .github/workflows/apply-icon-polish-ui-20260722.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_verification_placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-verification-placeholder
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v4
        with:
          ref: fix/video-campaign-finance-cyber-ui-20260722
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded UI-only patch
        run: python automation/apply_icon_polish_ui_20260722.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Install locked dependencies
        working-directory: abc-creator-app
        run: npm ci

      - name: Build production application
        working-directory: abc-creator-app
        run: npm run build

      - name: Validate exact UI-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | grep '^abc-creator-app/' | sort -u || true)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/components/PlatformToolLogo.tsx'
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/components/ThemeIcon.tsx'
          grep -q 'case "campaign"' abc-creator-app/components/ThemeIcon.tsx
          grep -q 'M8.5 7.3v9.4' abc-creator-app/components/ThemeIcon.tsx
          grep -q 'mr-4 inline-flex shrink-0' abc-creator-app/components/PlatformToolLogo.tsx
          ! printf '%s\n' "$changed" | grep -E 'api/|lib/tools/|server|credit|prompt|ToolFormRenderer|public-tools'

      - name: Remove temporary automation files
        run: |
          rm automation/apply_icon_polish_ui_20260722.py
          rm .github/workflows/apply-icon-polish-ui-20260722.yml

      - name: Commit verified UI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish video, campaign, finance and cybersecurity UI icons'
          git push origin HEAD:fix/video-campaign-finance-cyber-ui-20260722
