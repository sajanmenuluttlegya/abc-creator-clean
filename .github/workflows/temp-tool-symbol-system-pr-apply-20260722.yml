name: Temporary tool symbol system PR apply

on:
  pull_request:
    branches:
      - main
    paths:
      - automation/apply_tool_symbol_system_20260722.py
      - .github/workflows/apply-tool-symbol-system-20260722.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-build-and-commit:
    if: github.event.pull_request.head.ref == 'feat/unified-tool-symbol-system-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_verification_placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-verification-placeholder
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct guarded platform shell count
        run: sed -i 's/, 21, "platform logo shell sizing")/, 22, "platform logo shell sizing")/' automation/apply_tool_symbol_system_20260722.py

      - name: Apply guarded symbol-system patch
        run: python automation/apply_tool_symbol_system_20260722.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Install locked dependencies
        working-directory: abc-creator-app
        run: npm ci

      - name: Build production application
        working-directory: abc-creator-app
        run: npm run build

      - name: Validate strict symbol-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | grep '^abc-creator-app/' | sort -u || true)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 7
          for path in \
            'abc-creator-app/components/PlatformToolLogo.tsx' \
            'abc-creator-app/components/ThemeIcon.tsx' \
            'abc-creator-app/app/tools/page.tsx' \
            'abc-creator-app/components/ToolCategorySidebar.tsx' \
            'abc-creator-app/components/OutputPanel.tsx' \
            'abc-creator-app/components/PresetBlogOutputPanel.tsx' \
            'abc-creator-app/components/EmailOutputEditorPanel.tsx'; do
            printf '%s\n' "$changed" | grep -qx "$path"
          done
          grep -q 'export function ToolCategoryIcon' abc-creator-app/components/PlatformToolLogo.tsx
          grep -q 'export function ToolActionIcon' abc-creator-app/components/PlatformToolLogo.tsx
          grep -q 'ToolActionIcon' abc-creator-app/components/OutputPanel.tsx
          grep -q 'ToolActionIcon' abc-creator-app/components/PresetBlogOutputPanel.tsx
          grep -q 'ToolActionIcon' abc-creator-app/components/EmailOutputEditorPanel.tsx
          ! printf '%s\n' "$changed" | grep -E 'public-tools|credit|server-|ToolFormRenderer|api/generate|lib/tools/public-'

      - name: Remove temporary branch automation
        run: |
          rm automation/apply_tool_symbol_system_20260722.py
          rm .github/workflows/apply-tool-symbol-system-20260722.yml

      - name: Commit verified symbol system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use one tool symbol system throughout the website'
          git push origin "HEAD:${TARGET_BRANCH}"
