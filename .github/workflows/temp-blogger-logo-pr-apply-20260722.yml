name: Temporary Blogger logo PR apply

on:
  pull_request:
    branches:
      - main
    paths:
      - automation/apply_blogger_logo_20260722.py
      - .github/workflows/apply-blogger-logo-20260722.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-build-and-commit:
    if: github.event.pull_request.head.ref == 'fix/blogger-logo-for-blog-tools-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_verification_placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-verification-placeholder
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded Blogger logo patch
        run: python automation/apply_blogger_logo_20260722.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Install locked dependencies
        working-directory: abc-creator-app
        run: npm ci

      - name: Build production application
        working-directory: abc-creator-app
        run: npm run build

      - name: Validate icon-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | grep '^abc-creator-app/' | sort -u || true)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/components/PlatformToolLogo.tsx'
          grep -q 'category.includes("blog")' abc-creator-app/components/PlatformToolLogo.tsx
          grep -q 'case "blogger"' abc-creator-app/components/PlatformToolLogo.tsx
          grep -q '#FF6D2D' abc-creator-app/components/PlatformToolLogo.tsx
          ! printf '%s\n' "$changed" | grep -E 'public-tools|credit|server-|ToolFormRenderer|api/generate|app/tools/page|app/tools/\[slug\]/page'

      - name: Remove temporary branch automation
        run: |
          rm automation/apply_blogger_logo_20260722.py
          rm .github/workflows/apply-blogger-logo-20260722.yml

      - name: Commit verified Blogger logo implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use Blogger logo for all Blog tools'
          git push origin "HEAD:${TARGET_BRANCH}"
