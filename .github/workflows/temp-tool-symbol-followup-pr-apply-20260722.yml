name: Temporary tool symbol compact-logo follow-up

on:
  pull_request:
    branches:
      - main
    paths:
      - automation/fix_tool_symbol_compact_logo_20260722.py

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-build-and-commit:
    if: github.event.pull_request.head.ref == 'feat/unified-tool-symbol-system-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_verification_placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-verification-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact logo correction
        run: python automation/fix_tool_symbol_compact_logo_20260722.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json
      - name: Install locked dependencies
        working-directory: abc-creator-app
        run: npm ci
      - name: Build production application
        working-directory: abc-creator-app
        run: npm run build
      - name: Validate compact-logo-only follow-up
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | grep '^abc-creator-app/' || true)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/components/PlatformToolLogo.tsx'
          grep -q 'className={`${symbolSizeClasses\[size\]} object-contain`}' abc-creator-app/components/PlatformToolLogo.tsx
      - name: Remove follow-up script
        run: rm automation/fix_tool_symbol_compact_logo_20260722.py
      - name: Commit verified follow-up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep platform logos correctly sized in compact links'
          git push origin "HEAD:${TARGET_BRANCH}"
