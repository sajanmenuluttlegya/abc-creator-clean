name: M0 Exact Resolution and M1 Credits Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m0-exact-resolution-m1-credits-once.yml"
      - "automation/apply_m0_exact_native_resolution_and_m1_credits_once.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct M0-only validation in the one-time patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("automation/apply_m0_exact_native_resolution_and_m1_credits_once.py")
          text = path.read_text(encoding="utf-8")
          old = '''    for path, text in updates.items():
                  require(OLD_M0_CREDITS not in text, f"Old M0 credit map remains in {path}")
          '''
          new = '''    for path, text in updates.items():
                  require(
                      f"M0: {OLD_M0_CREDITS}" not in text,
                      f"Old M0 credit map remains in {path}",
                  )
          '''
          if old not in text:
              raise SystemExit("Expected validation block was not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Apply and validate the approved patch
        id: patch
        shell: bash
        run: |
          set +e
          python automation/apply_m0_exact_native_resolution_and_m1_credits_once.py > m0-exact-patch.log 2>&1
          status=$?
          cat m0-exact-patch.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp m0-exact-patch.log automation/m0-exact-patch-failure.log
          fi
          exit 0

      - name: Commit failure diagnostics
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/m0-exact-patch-failure.log
          git commit -m "Record M0 exact resolution patch failure"
          git push origin HEAD:main
          exit 1

      - name: Validate controller syntax
        if: steps.patch.outputs.status == '0'
        run: python -m py_compile automation/m0_kaggle_controller.py

      - name: Remove one-time files and commit approved changes
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f automation/apply_m0_exact_native_resolution_and_m1_credits_once.py
          rm -f automation/m0-exact-patch-failure.log
          rm -f .github/workflows/m0-exact-resolution-m1-credits-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use exact M0 outputs without resizing and match M1 credits"
          git push origin HEAD:main
