name: Apply platform icon scope fix

on:
  push:
    branches:
      - fix/instagram-logo-and-detail-platform-icons-20260722
    paths:
      - automation/apply_platform_icon_scope_fix_20260722.py
      - .github/workflows/apply-platform-icon-scope-fix-20260722.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_verification_placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-verification-placeholder
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/instagram-logo-and-detail-platform-icons-20260722
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded icon-only patch
        run: python automation/apply_platform_icon_scope_fix_20260722.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Install locked dependencies
        working-directory: abc-creator-app
        run: npm ci

      - name: Build production application
        working-directory: abc-creator-app
        run: npm run build

      - name: Validate strict visual scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | grep '^abc-creator-app/' || true)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/app/tools/page.tsx'
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/app/tools/\[slug\]/page.tsx'
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/components/PlatformToolLogo.tsx'
          printf '%s\n' "$changed" | grep -qx 'abc-creator-app/public/platform-logos/instagram.svg'
          grep -q '/platform-logos/instagram.svg' abc-creator-app/components/PlatformToolLogo.tsx
          grep -q 'PlatformToolIcon tool={tool}' abc-creator-app/app/tools/page.tsx
          grep -q 'fallback={<span className="text-5xl leading-none"' 'abc-creator-app/app/tools/[slug]/page.tsx'
          ! git diff --name-only | grep -E 'public-tools|credit|server-|ToolFormRenderer|api/generate'

      - name: Remove temporary automation files
        run: |
          rm automation/apply_platform_icon_scope_fix_20260722.py
          rm .github/workflows/apply-platform-icon-scope-fix-20260722.yml

      - name: Commit verified icon-only implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use exact platform logos on list and tool pages'
          git push origin HEAD:fix/instagram-logo-and-detail-platform-icons-20260722

# Retry marker after corrected PR validation.
