name: Apply additive audit fixes

on:
  push:
    branches:
      - main
    paths:
      - automation/apply_additive_audit_fixes_20260721.py
      - .github/workflows/apply-additive-audit-fixes-20260721.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded fixes
        run: python automation/apply_additive_audit_fixes_20260721.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Install dependencies
        working-directory: abc-creator-app
        run: npm ci

      - name: Production build
        working-directory: abc-creator-app
        run: npm run build

      - name: Validate protected and additive scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          ! printf '%s\n' "$changed" | grep -E '^abc-creator-app/lib/tools/public-book-variation-overrides\.ts$'
          ! printf '%s\n' "$changed" | grep -E '^abc-creator-app/lib/tools/public-blog-tools\.ts$'
          ! printf '%s\n' "$changed" | grep -E '^abc-creator-app/lib/tools/server-blog'
          grep -q 'Regenerate — 2 credits' abc-creator-app/components/PresetBlogOutputPanel.tsx
          grep -q 'serverPosterPromotionalTools' abc-creator-app/lib/tools/server-prompt-registry.ts
          grep -q 'posterPromotionalTools' abc-creator-app/lib/tools/public-tools.ts
          grep -q 'book_title_generation_invalid_count' abc-creator-app/app/api/generate/stream/route.ts

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abc-creator-app
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Restore Blog scope and complete additive audit fixes'
          git push origin HEAD:main
