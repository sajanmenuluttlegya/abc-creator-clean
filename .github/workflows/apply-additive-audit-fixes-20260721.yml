name: Apply additive audit fixes

on:
  push:
    branches:
      - main
    paths:
      - automation/apply_additive_audit_fixes_20260721.py
      - .github/workflows/apply-additive-audit-fixes-20260721.yml
  pull_request:
    branches:
      - main
    paths:
      - automation/apply_additive_audit_fixes_20260721.py
      - .github/workflows/apply-additive-audit-fixes-20260721.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || 'main' }}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_verification_placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-verification-placeholder
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded fixes
        id: patch
        shell: bash
        run: |
          set +e
          python automation/apply_additive_audit_fixes_20260721.py > automation/additive-audit-fix-run.log 2>&1
          status=$?
          cat automation/additive-audit-fix-run.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit patch diagnostics on failure
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/additive-audit-fix-run.log
          git commit -m 'Record additive audit fixer failure'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Stop after patch failure
        if: steps.patch.outputs.status != '0'
        run: exit 1

      - name: Set up Node
        if: steps.patch.outputs.status == '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Install dependencies
        if: steps.patch.outputs.status == '0'
        working-directory: abc-creator-app
        run: npm ci

      - name: Production build
        id: build
        if: steps.patch.outputs.status == '0'
        shell: bash
        working-directory: abc-creator-app
        run: |
          set +e
          npm run build > ../automation/additive-audit-build.log 2>&1
          status=$?
          cat ../automation/additive-audit-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit build diagnostics on failure
        if: steps.patch.outputs.status == '0' && steps.build.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/additive-audit-build.log
          git commit -m 'Record additive audit build failure'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Stop after build failure
        if: steps.patch.outputs.status == '0' && steps.build.outputs.status != '0'
        run: exit 1

      - name: Validate protected and additive scope
        if: steps.patch.outputs.status == '0' && steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          ! printf '%s\n' "$changed" | grep -E '^abc-creator-app/lib/tools/public-book-variation-overrides\.ts$'
          ! printf '%s\n' "$changed" | grep -E '^abc-creator-app/lib/tools/public-blog-tools\.ts$'
          ! printf '%s\n' "$changed" | grep -E '^abc-creator-app/lib/tools/server-blog'
          grep -q 'Regenerate — 2 credits' abc-creator-app/components/PresetBlogOutputPanel.tsx
          grep -q 'serverPosterPromotionalTools' abc-creator-app/lib/tools/server-prompt-registry.ts
          grep -q 'posterPromotionalTools' abc-creator-app/lib/tools/public-tools.ts
          grep -q 'book_title_generation_invalid_count' abc-creator-app/app/api/generate/stream/route.ts

      - name: Commit validated implementation
        if: steps.patch.outputs.status == '0' && steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abc-creator-app
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Restore Blog scope and complete additive audit fixes'
          git push origin "HEAD:${TARGET_BRANCH}"

# Final PR trigger from the current main branch.
