name: ABC Creator Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: abc-creator-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: abc-creator-app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "build-verification-placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "build-verification-placeholder"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build production application
        run: npm run build
