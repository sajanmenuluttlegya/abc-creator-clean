name: UI and credit upgrade 2026-07-21

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-credit-upgrade-20260721.yml"
      - "automation/apply_ui_credit_upgrade_20260721.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ui-credit-upgrade-20260721.yml"
      - "automation/ui-credit-upgrade-trigger.txt"
      - "automation/apply_ui_credit_upgrade_20260721.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-credit-upgrade-20260721
  cancel-in-progress: false

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply additive upgrade
        id: patch
        shell: bash
        run: |
          set +e
          python automation/apply_ui_credit_upgrade_20260721.py > automation/ui-credit-upgrade-failure.log 2>&1
          status=$?
          cat automation/ui-credit-upgrade-failure.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit exact failure diagnostic
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/ui-credit-upgrade-failure.log
          git commit -m "Record UI credit patch failure"
          git push origin HEAD:main
          exit 1

      - name: Install application dependencies
        if: steps.patch.outputs.status == '0'
        working-directory: abc-creator-app
        run: npm install --no-audit --no-fund

      - name: Run production build
        if: steps.patch.outputs.status == '0'
        working-directory: abc-creator-app
        run: npm run build

      - name: Commit validated changes
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abc-creator-app automation/ui-credit-upgrade-audit-20260721.txt
          if git diff --cached --quiet; then
            echo "No changes were needed."
            exit 0
          fi
          git commit -m "Upgrade newer tool UI and correct dynamic credits"
          git push origin HEAD:main
