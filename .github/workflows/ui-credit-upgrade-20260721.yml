name: UI and credit upgrade 2026-07-21

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-credit-upgrade-20260721.yml"
      - "automation/apply_ui_credit_upgrade_20260721.py"
      - "automation/apply_ui_credit_finalization_20260721.py"
      - "automation/refine_output_copy_preservation_20260721.py"
      - "automation/finalize_book_title_regeneration_20260721.py"
      - "automation/audit_count_driven_text_tools_20260721.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ui-credit-upgrade-20260721.yml"
      - "automation/ui-credit-upgrade-trigger.txt"
      - "automation/apply_ui_credit_upgrade_20260721.py"
      - "automation/apply_ui_credit_finalization_20260721.py"
      - "automation/refine_output_copy_preservation_20260721.py"
      - "automation/finalize_book_title_regeneration_20260721.py"
      - "automation/audit_count_driven_text_tools_20260721.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-credit-upgrade-20260721
  cancel-in-progress: false

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct live-file patch matchers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path("abc-creator-app/lib/tools/server-book-tools.ts")
          text = server.read_text(encoding="utf-8")
          old = '''    outputGuide: `${titlePageGuide}

          Return: # Book Title Options. Scale title count by output_length: Compact = 10 titles, Standard = 20 titles, Long = 40 titles, Premium deep = 60 titles plus deeper subtitle, series, tagline, positioning, reader-promise, and shortlist notes. Include ## Title Strategy, ## Premium Titles, ## Subtitle Options, ## Series Title Options, ## Taglines, ## Best Picks by Reader Promise, and ## Verify Before Publishing. Do not claim availability.`'''.replace("          Return:", "Return:")
          new = '''    outputGuide: `${titlePageGuide}

          Return # Book Title Options. Produce exactly the selected title_count: 1, 3, 5, or 10 title options—never extra titles. Keep the response focused. For each title include one concise rationale and, only when useful, one subtitle or series-line suggestion. End with a short Best Fit note and a Verify Availability reminder. Do not claim title, domain, trademark, or marketplace availability.`'''.replace("          Return", "Return")
          if old in text:
              server.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif "Produce exactly the selected title_count" not in text and "Return # Book Title Options and exactly the selected title_count" not in text:
              raise SystemExit("Current Book Title output guide could not be matched.")

          script = Path("automation/apply_ui_credit_upgrade_20260721.py")
          script_text = script.read_text(encoding="utf-8")
          script_text = script_text.replace(
              '    elif new_guide not in text:\n        raise RuntimeError("Book title output-guide block not found")',
              '    elif "Produce exactly the selected title_count" not in text and "Return # Book Title Options and exactly the selected title_count" not in text:\n        raise RuntimeError("Book title output-guide block not found")',
              1,
          )
          script_text = script_text.replace(
              'index = text.find("export const publicTools = rawPublicTools.filter")',
              'index = text.find("export const publicTools")',
              1,
          )
          script_text = script_text.replace(
              "old = 'export const publicTools = rawPublicTools.filter((tool, index, tools) => tools.findIndex((candidate) => candidate.slug === tool.slug) === index);'",
              "old = 'export const publicTools: Tool[] = rawPublicTools.filter((tool, index, tools) => tools.findIndex((item) => item.slug === tool.slug) === index);'",
              1,
          )
          script_text = script_text.replace(
              '        text = replace_once(text, "\\n];", insertion + "\\n];", "book title override insertion")',
              '        head, marker, tail = text.rpartition("\\n];")\n        if not marker: raise RuntimeError("Book title tools array terminator not found")\n        text = head + insertion + "\\n];" + tail',
              1,
          )
          script.write_text(script_text, encoding="utf-8")
          PY

      - name: Apply additive upgrade
        id: patch
        shell: bash
        run: |
          set +e
          python automation/apply_ui_credit_upgrade_20260721.py > automation/ui-credit-upgrade-failure.log 2>&1
          status=$?
          cat automation/ui-credit-upgrade-failure.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply final scope and planner corrections
        if: steps.patch.outputs.status == '0'
        run: python automation/apply_ui_credit_finalization_20260721.py

      - name: Preserve legitimate output wording
        if: steps.patch.outputs.status == '0'
        run: python automation/refine_output_copy_preservation_20260721.py

      - name: Finalize Book Title Generator regeneration
        if: steps.patch.outputs.status == '0'
        run: python automation/finalize_book_title_regeneration_20260721.py

      - name: Audit count-driven text tools
        if: steps.patch.outputs.status == '0'
        run: python automation/audit_count_driven_text_tools_20260721.py

      - name: Commit exact patch failure diagnostic
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/ui-credit-upgrade-failure.log
          git commit -m "Record UI credit patch failure"
          git push origin HEAD:main
          exit 1

      - name: Install application dependencies
        if: steps.patch.outputs.status == '0'
        working-directory: abc-creator-app
        run: npm install --no-audit --no-fund

      - name: Run production build
        if: steps.patch.outputs.status == '0'
        id: build
        shell: bash
        working-directory: abc-creator-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: |
          set +e
          npm run build > ../automation/ui-credit-build-failure.log 2>&1
          status=$?
          cat ../automation/ui-credit-build-failure.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit exact build failure diagnostic
        if: steps.patch.outputs.status == '0' && steps.build.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/ui-credit-build-failure.log
          git commit -m "Record UI credit build failure"
          git push origin HEAD:main
          exit 1

      - name: Commit validated changes
        if: steps.patch.outputs.status == '0' && steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abc-creator-app automation/ui-credit-upgrade-audit-20260721.txt automation/count-driven-text-tools-audit-20260721.txt
          if git diff --cached --quiet; then
            echo "No changes were needed."
            exit 0
          fi
          git commit -m "Audit newer count-driven text tools"
          git push origin HEAD:main
