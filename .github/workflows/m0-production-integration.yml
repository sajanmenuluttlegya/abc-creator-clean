name: M0 Production Integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/m0-production-integration
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: abc-creator-app/package-lock.json

      - name: Apply M0 integration
        shell: bash
        run: |
          set -o pipefail
          node abc-creator-app/scripts/apply-m0-production-integration.mjs 2>&1 | tee m0-integration.log

      - name: Install dependencies
        working-directory: abc-creator-app
        run: npm install --no-audit --no-fund

      - name: Lint M0 integration files
        working-directory: abc-creator-app
        shell: bash
        run: |
          set -o pipefail
          npx eslint \
            lib/image-tools/image-models.ts \
            lib/image-tools/m0-image-client.ts \
            lib/image-tools/cloudflare-image-client.ts \
            app/api/image/text-to-image/route.ts \
            components/AnimationCharacterSheetPanel.tsx \
            components/FashionApparelImagePanel.tsx \
            components/FoodHospitalityImagePanel.tsx \
            components/ImageTextToImagePanel.tsx \
            components/InteriorArchitectureImagePanel.tsx \
            components/MangaSceneGeneratorPanel.tsx \
            components/MarketingCampaignImagePanel.tsx \
            --rule 'react-hooks/set-state-in-effect: off' \
            2>&1 | tee ../m0-lint.log

      - name: Build full production application
        working-directory: abc-creator-app
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          M0_REGISTRATION_TOKEN: build-placeholder-registration-token
          M0_WORKER_API_KEY: build-placeholder-worker-key
          M0_ALLOWED_WORKERS: m0-cinefax
          M0_ALLOWED_TUNNEL_SUFFIXES: .trycloudflare.com
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../m0-build.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-validation-diagnostics
          path: |
            m0-integration.log
            m0-lint.log
            m0-build.log
          if-no-files-found: warn

      - name: Commit validated integration
        run: |
          if git diff --quiet; then
            echo "No integration changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abc-creator-app
          git commit -m "Integrate M0 production image worker"
          git push origin HEAD:feature/m0-production-integration
